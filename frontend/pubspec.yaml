name: gt2000
description: GESTION TALLERES 2000 - App móvil para gestión de talleres mecánicos.
  TFG Nahid Larhziale Oullada - DAM 2025-2026

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.1
  http: ^1.1.0
  shared_preferences: ^2.2.2
  mobile_scanner: ^3.5.6
  image_picker: ^1.0.7
  intl: ^0.18.1
  cupertino_icons: ^1.0.6
  lottie: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/