# =====================================================================
# CONFIGURACIÓN DE APLICACIÓN - GESTION TALLERES 2000
# Backend Spring Boot - TFG Nahid Larhziale Oullada
# =====================================================================

# ---------------------------------------------------------------------
# CONFIGURACIÓN DEL SERVIDOR
# ---------------------------------------------------------------------
server:
  port: 8085
  servlet:
    context-path: /api

# ---------------------------------------------------------------------
# CONFIGURACIÓN DE BASE DE DATOS MySQL
# ---------------------------------------------------------------------
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gestion_talleres?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
    username: admin_taller
    password: Taller2026*
    driver-class-name: com.mysql.cj.jdbc.Driver

  # -------------------------------------------------------------------
  # CONFIGURACIÓN JPA / HIBERNATE
  # -------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # -------------------------------------------------------------------
  # CONFIGURACIÓN DE CARPETA DE SUBIDAS (fotos de órdenes)
  # -------------------------------------------------------------------
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

# ---------------------------------------------------------------------
# CONFIGURACIÓN JWT (JSON Web Token)
# ---------------------------------------------------------------------
jwt:
  secret: GestionTalleres2000SecretKeyParaJWT2026NahidLarhzialeOulladaDAM
  expiration: 86400000  # 24 horas en milisegundos

# ---------------------------------------------------------------------
# CONFIGURACIÓN DE RUTAS DE ARCHIVOS
# ---------------------------------------------------------------------
upload:
  path: ./uploads
  base-url: http://localhost:8080/api/uploads

# ---------------------------------------------------------------------
# CONFIGURACIÓN DE CORS (Cross-Origin Resource Sharing)
# ---------------------------------------------------------------------
cors:
  allowed-origins: "*"
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"

# ---------------------------------------------------------------------
# CONFIGURACIÓN DE LOGGING
# ---------------------------------------------------------------------
logging:
  level:
    com.gt2000: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG